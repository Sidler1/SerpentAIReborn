[project]
name = "serpent"
version = "2026.0.0.dev0"
description = "Game Agent Development Kit — create AIs / bots that learn to play any game you own."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE.md" }
authors = [
    { name = "Nicholas Brochu", email = "nicholas@serpent.ai" },
    { name = "SerpentAI Reborn contributors" },
]
keywords = ["AI", "Machine Learning", "Reinforcement Learning", "Games", "Computer Vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment",
]

# Phase A deliberately carries a lean, *modern* dependency set: enough for the
# core package to import and the lighter unit tests to run. The heavy/ML pieces
# (torch/torchvision) arrive with the ML phase; the dead 2020 stack
# (tensorflow, crossbar/autobahn/twisted, cefpython3, kivy, pony, aioredis,
# lmdb, comet_ml, luminoth) is dropped per the modernization roadmap.
dependencies = [
    # Scientific computing
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-image>=0.25",
    "scikit-learn>=1.5",
    "Pillow>=11.0",
    "h5py>=3.12",
    # Config / CLI
    "PyYAML>=6.0",
    "click>=8.1",
    "tqdm>=4.66",
    # offshoot (the plugin framework) is vendored into the repo — see ./offshoot
    # Screen capture
    "mss>=9.0",
    # Input vocabulary + capture
    "sneakysnek>=0.1.1",
    "pyautogui>=0.9.54",
    "pyperclip>=1.9",
    # OCR
    "pytesseract>=0.3.10",
    "Levenshtein>=0.26",
    # Data bus (sync + asyncio live in the same package since redis-py 4.2)
    "redis>=5.0",
    # Reinforcement learning (Rainbow DQN / PPO). The Linux/Windows PyPI wheels
    # bundle CUDA; device is auto-detected at runtime (cuda/rocm/mps/cpu).
    "torch>=2.5",
    # Dashboard + visual debugger (local web apps; replaced the dead cef/kivy/pony stack)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Window control (Linux X11; Wayland backend added in a later phase)
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "pywin32>=306 ; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://serpent.ai"
Repository = "https://github.com/Sidler1/SerpentAIReborn"

[project.scripts]
serpent = "cli:cli"

[dependency-groups]
dev = [
    "ruff>=0.10",
    "pytest>=8.0",
    "httpx>=0.27",  # FastAPI TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serpent", "offshoot"]

[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "cli.py"

[tool.ruff]
line-length = 100
target-version = "py313"
# Legacy 2020 modules are linted as they are modernized, phase by phase. This
# exclude list shrinks each phase; today only freshly-touched files are gated.
extend-exclude = ["serpent", "cli.py", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["serpent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
