[project]
name = "serpent"
version = "0.2.0.dev0"
description = "Serpent — a cross-platform Python game agent development kit"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE.md" }
authors = [{ name = "SerpentAI contributors" }]
keywords = ["game", "agent", "reinforcement-learning", "computer-vision", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
# Runtime dependencies are added per phase as the new architecture lands.
dependencies = []

[project.urls]
Homepage = "https://github.com/SerpentAI/Serpent"
Repository = "https://github.com/SerpentAI/Serpent"

[project.scripts]
serpent = "serpent.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.10",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serpent"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Legacy prototype code (lib/, plugins/, bin/, tasks.py) is ported and removed
# across later phases; exclude it so CI gates only the new `src/serpent` package.
extend-exclude = ["lib", "plugins", "bin", "tasks.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["serpent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
