name: CI

on:
  push:
    branches: [dev, reborn, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # Also gate the modernized serpent/ modules (the rest of serpent/ is still
      # legacy and excluded in pyproject; this list grows as modules are modernized).
      - name: Ruff lint (modernized modules)
        run: uv run ruff check ${{ env.MODERN_PATHS }}

      - name: Ruff format check (modernized modules)
        run: uv run ruff format --check ${{ env.MODERN_PATHS }}

      - name: Run tests
        run: uv run pytest

    env:
      MODERN_PATHS: >-
        serpent/transport
        serpent/dashboard
        serpent/visual_debugger/server.py
        serpent/visual_debugger/visual_debugger.py
        serpent/machine_learning/device.py
        serpent/machine_learning/context_classification/context_classifiers/cnn_context_classifier.py
        serpent/input_controllers/redis_input_controller_worker.py
        serpent/window_controllers/wayland_window_controller.py
